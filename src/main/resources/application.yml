server:
  port: 8088
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rongxiaotong?serverTimezone=GMT%2B8&useUnicode=true&characterEncodeing=UTF-8&useSSL=false
    username: mysqlliang #记得修改为自己的数据库用户名
    password: 112211 #记得修改为自己的数据库密码
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: rongxiaotong20260918
  web:
    resources:
      static-locations: file:${application.upload-path}
  mvc:
    static-path-pattern: /**
  data:
    redis:
      host: localhost
      port: 6379

# 文件上传配置（绝对路径，项目根目录下的 uploads 文件夹）
application:
  upload-path: ${user.dir}/uploads

# MyBatis-Plus 配置（原 pagehelper 已移除，分页由 PaginationInnerInterceptor 实现）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# nginx存放图片的路径
file:
  location:
    directory: /usr/local/learn/docker/nginx/html/
# 支付宝 appId,私钥，支付宝公钥
alipay:
  info:
    appId:
    privateKey:
    alipayPublicKey: