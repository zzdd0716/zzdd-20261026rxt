server:
  port: 8088
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rongxiaotong?serverTimezone=GMT%2B8&useUnicode=true&characterEncodeing=UTF-8&useSSL=false
    username: mysqlliang
    password: 112211
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  application:
    name: rongxiaotong20260918
  web:
    resources:
      static-locations: file:${application.upload-path}
  mvc:
    static-path-pattern: file:d:/wangyanan/file/order,file:d:/wangyanan/file/avatar,file:d:/wangyanan/file/video
  data:
    redis:
      host: localhost
      port: 6379
application:
    upload-path: d:/wangyanan/file

# PageHelper 配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

#mybatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

#nginx存放图片的路径
file:
  location:
    directory: /usr/local/learn/docker/nginx/html/
